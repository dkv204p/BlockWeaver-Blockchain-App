<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockWeaver - Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Welcome to BlockWeaver</h1>
        <p class="lead">Choose an action:</p>

        {% if current_user.is_authenticated %}
            <p class="text-success">Logged in as {{ current_user.username }}</p>
            <a href="{{ url_for('submit_transaction') }}" class="btn btn-primary">Submit Transaction</a>
            <a href="{{ url_for('mine_block') }}" class="btn btn-success">Mine Block</a>
            <a href="{{ url_for('full_chain') }}" class="btn btn-info">View Blockchain</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-primary">Login</a>
            <a href="{{ url_for('register') }}" class="btn btn-secondary">Register</a>
        {% endif %}
    </div>
</body>
</html>
